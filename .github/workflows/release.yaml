name: release

# Two modes:
#   - release: triggered by `v*` tag push. Multi-arch build, full
#     image+chart sign + SBOM + attest, plus GitHub Release asset upload.
#   - dev:     any other push (any branch) or manual workflow_dispatch.
#     Single-arch (amd64) build, image+chart still signed + SBOM'd.
#     Versioned `0.0.0-dev.<short-sha>` so users can `helm install
#     --version 0.0.0-dev.abc1234` to test a specific commit.
on:
  push:
    tags:     ['v*']
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0

      - name: install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      # ------ mode (release vs dev) ----------------------------------------

      - name: compute mode
        id: mode
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            CHART_VERSION="${VERSION#v}"
            {
              echo "mode=release"
              echo "version=${VERSION}"
              echo "chart_version=${CHART_VERSION}"
              echo "platforms=linux/amd64,linux/arm64"
              echo "extra_image_tags=ghcr.io/lhns/kube-webtop-workspaces:latest"
            } >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA::7}"
            CHART_VERSION="0.0.0-dev.${SHORT}"
            BRANCH=$(echo "${GITHUB_REF_NAME}" | tr -c 'a-zA-Z0-9-' '-' | sed 's/-\+/-/g; s/^-\|-$//g')
            {
              echo "mode=dev"
              echo "version=${CHART_VERSION}"
              echo "chart_version=${CHART_VERSION}"
              echo "platforms=linux/amd64"
              echo "extra_image_tags=ghcr.io/lhns/kube-webtop-workspaces:sha-${SHORT},ghcr.io/lhns/kube-webtop-workspaces:${BRANCH}"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "Mode resolved:" && cat "$GITHUB_OUTPUT"

      # ------ container image -----------------------------------------------

      - name: build & push image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ steps.mode.outputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/lhns/kube-webtop-workspaces:${{ steps.mode.outputs.version }}
            ${{ steps.mode.outputs.extra_image_tags }}

      - name: cosign sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "ghcr.io/lhns/kube-webtop-workspaces@${{ steps.build_image.outputs.digest }}"

      - name: generate image SBOM
        run: |
          syft "ghcr.io/lhns/kube-webtop-workspaces@${{ steps.build_image.outputs.digest }}" \
            -o spdx-json=kube-webtop-workspaces-image.sbom.spdx.json

      - name: cosign attach SBOM as attestation
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --predicate kube-webtop-workspaces-image.sbom.spdx.json \
            --type spdx \
            "ghcr.io/lhns/kube-webtop-workspaces@${{ steps.build_image.outputs.digest }}"

      # The desktop image (NixOS, built with Nix) has its own job below.

      # ------ Helm chart ----------------------------------------------------

      - name: package & push Helm chart
        id: helm_push
        env:
          CHART_VERSION: ${{ steps.mode.outputs.chart_version }}
          # The chart defaults image.tag to .Chart.AppVersion, so the chart
          # always deploys the image built above.
          APP_VERSION:   ${{ steps.mode.outputs.version }}
        run: |
          helm package charts/kube-webtop-workspaces \
            --version "$CHART_VERSION" \
            --app-version "$APP_VERSION" \
            --destination .
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push "kube-webtop-workspaces-${CHART_VERSION}.tgz" oci://ghcr.io/lhns/charts \
            2>&1 | tee helm-push.log
          DIGEST=$(grep -E '^Digest: ' helm-push.log | awk '{print $2}')
          echo "chart_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

      - name: cosign sign Helm chart (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "ghcr.io/lhns/charts/kube-webtop-workspaces@${{ steps.helm_push.outputs.chart_digest }}"

      - name: generate chart SBOM
        run: |
          syft "kube-webtop-workspaces-${{ steps.helm_push.outputs.chart_version }}.tgz" \
            -o spdx-json=kube-webtop-workspaces-chart.sbom.spdx.json

      - name: cosign attach chart SBOM as attestation
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --predicate kube-webtop-workspaces-chart.sbom.spdx.json \
            --type spdx \
            "ghcr.io/lhns/charts/kube-webtop-workspaces@${{ steps.helm_push.outputs.chart_digest }}"

      # ------ GitHub Release ------------------------------------------------

      - name: checksums for release assets
        run: |
          sha256sum kube-webtop-workspaces-*.tgz \
            kube-webtop-workspaces-image.sbom.spdx.json kube-webtop-workspaces-chart.sbom.spdx.json \
            > checksums.txt
          cat checksums.txt

      - name: attach release assets
        if: steps.mode.outputs.mode == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            kube-webtop-workspaces-*.tgz
            kube-webtop-workspaces-image.sbom.spdx.json
            kube-webtop-workspaces-chart.sbom.spdx.json
            checksums.txt

  # ------ desktop image (NixOS) -------------------------------------------
  # Built with Nix (flake.nix, nix2container) in parallel with the job above;
  # same tag scheme. amd64 only: the Selkies/pixelflux wheels are x86_64.
  desktop-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/lhns/kube-webtop-workspaces-desktop
    steps:
      - uses: actions/checkout@v7

      # The Plasma closure is several GB; the runner's preinstalled SDKs are not needed.
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The cache below is a local binary cache of the patched KWin closure (the rest of the build comes from
      # cache.nixos.org). Signatures are not checked: only this repo's workflows write that cache.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = file:///home/runner/kwin-cache
            require-sigs = false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0

      - name: compute tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tags=${GITHUB_REF_NAME} latest" >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA::7}"
            BRANCH=$(echo "${GITHUB_REF_NAME}" | tr -c 'a-zA-Z0-9-' '-' | sed 's/-\+/-/g; s/^-\|-$//g')
            echo "tags=0.0.0-dev.${SHORT} sha-${SHORT} ${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      # The patched KWin (webtop-nix) is about an hour of build; restore it by its store path, which
      # changes with the patch, nixpkgs and flake.lock. The image build then finds it in the store.
      - name: patched KWin store path
        id: kwin
        run: |
          out=$(nix eval --raw .#kwin.outPath)
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "key=kwin-$(basename "$out" | cut -d- -f1)" >> "$GITHUB_OUTPUT"
      - name: restore patched KWin
        id: kwin-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/kwin-cache
          key: ${{ steps.kwin.outputs.key }}
      - name: build patched KWin
        run: |
          mkdir -p ~/kwin-cache
          nix build .#kwin -L --no-link
      # The whole closure: a binary cache refuses a path whose references it lacks. zstd keeps it small.
      - name: save patched KWin
        if: steps.kwin-cache.outputs.cache-hit != 'true'
        # The daemon (root) created parts of the directory while substituting.
        run: |
          sudo chown -R "$USER" ~/kwin-cache
          nix copy --to "file://$HOME/kwin-cache?compression=zstd" "${{ steps.kwin.outputs.out }}"
      - uses: actions/cache/save@v6
        if: steps.kwin-cache.outputs.cache-hit != 'true'
        with:
          path: ~/kwin-cache
          key: ${{ steps.kwin.outputs.key }}

      - name: build image
        run: nix build .#image -L

      # copyTo is skopeo copy from the Nix store; layers already pushed are skipped.
      - name: push image
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            nix run .#image.copyTo -- --digestfile digest \
              --dest-creds "${{ github.actor }}:${GHCR_TOKEN}" "docker://${IMAGE}:${tag}"
            echo "pushed ${IMAGE}:${tag}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"

      - name: cosign sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          # Rekor/Fulcio fail transiently; retry the whole call.
          for i in 1 2 3 4 5; do
            cosign sign "${IMAGE}@${{ steps.push.outputs.digest }}" && exit 0
            echo "cosign sign failed (attempt $i)"; sleep $((i * 15))
          done
          exit 1

      - name: generate image SBOM
        run: syft "${IMAGE}@${{ steps.push.outputs.digest }}" -o spdx-json=kube-webtop-workspaces-desktop.sbom.spdx.json

      # No attestation: Rekor rejects the SBOM of the Nix closure. It is published as a file only.
      - name: upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-sbom
          path: kube-webtop-workspaces-desktop.sbom.spdx.json

      - name: attach SBOM to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: kube-webtop-workspaces-desktop.sbom.spdx.json
