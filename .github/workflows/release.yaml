name: release

# Two modes:
#   - release: triggered by `v*` tag push. Multi-arch build, full
#     image+chart sign + SBOM + attest, plus GitHub Release asset upload.
#   - dev:     any other push (any branch) or manual workflow_dispatch.
#     Single-arch (amd64) build, image+chart still signed + SBOM'd.
#     Versioned `0.0.0-dev.<short-sha>` so users can `helm install
#     --version 0.0.0-dev.abc1234` to test a specific commit.
on:
  push:
    tags:     ['v*']
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0

      - name: install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      # ------ mode (release vs dev) ----------------------------------------

      - name: compute mode
        id: mode
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            CHART_VERSION="${VERSION#v}"
            {
              echo "mode=release"
              echo "version=${VERSION}"
              echo "chart_version=${CHART_VERSION}"
              echo "platforms=linux/amd64,linux/arm64"
              echo "extra_image_tags=ghcr.io/lhns/kube-webtop-workspaces:latest"
            } >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA::7}"
            CHART_VERSION="0.0.0-dev.${SHORT}"
            BRANCH=$(echo "${GITHUB_REF_NAME}" | tr -c 'a-zA-Z0-9-' '-' | sed 's/-\+/-/g; s/^-\|-$//g')
            {
              echo "mode=dev"
              echo "version=${CHART_VERSION}"
              echo "chart_version=${CHART_VERSION}"
              echo "platforms=linux/amd64"
              echo "extra_image_tags=ghcr.io/lhns/kube-webtop-workspaces:sha-${SHORT},ghcr.io/lhns/kube-webtop-workspaces:${BRANCH}"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "Mode resolved:" && cat "$GITHUB_OUTPUT"

      # ------ container image -----------------------------------------------

      - name: build & push image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ steps.mode.outputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/lhns/kube-webtop-workspaces:${{ steps.mode.outputs.version }}
            ${{ steps.mode.outputs.extra_image_tags }}

      - name: cosign sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "ghcr.io/lhns/kube-webtop-workspaces@${{ steps.build_image.outputs.digest }}"

      - name: generate image SBOM
        run: |
          syft "ghcr.io/lhns/kube-webtop-workspaces@${{ steps.build_image.outputs.digest }}" \
            -o spdx-json=kube-webtop-workspaces-image.sbom.spdx.json

      # No attestation: Rekor rejects the SBOM of the Nix closure. It is published as a file only.
      - name: upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-sbom
          path: kube-webtop-workspaces-desktop.sbom.spdx.json

      - name: attach SBOM to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: kube-webtop-workspaces-desktop.sbom.spdx.json
