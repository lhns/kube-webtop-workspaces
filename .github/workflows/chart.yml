name: chart

on:
  pull_request:
    paths: ["charts/**", "config/**", ".github/workflows/chart.yml"]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: make chart-check

  publish:
    # Pushes the chart as an OCI artifact: oci://ghcr.io/<owner>/charts/kube-webtop-workspaces
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Package and push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          version="$(awk '/^version:/{print $2}' charts/kube-webtop-workspaces/Chart.yaml)"
          # main builds get a prerelease suffix so they never overwrite a released chart version.
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then version="${version}-main.${GITHUB_SHA::7}"; fi
          helm package charts/kube-webtop-workspaces --version "$version" --destination dist
          helm push "dist/kube-webtop-workspaces-${version}.tgz" "oci://ghcr.io/${owner}/charts"
