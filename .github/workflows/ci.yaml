name: ci

# Checks on every PR and on main; publishing (controller image, desktop image, chart) is a job of the
# same workflow, so it runs only when every check is green:
#   - push to main:  0.0.0-dev.<sha7> (images also sha-<sha7> and main)
#   - tag vX.Y.Z:    images vX.Y.Z (+ latest unless a prerelease), chart X.Y.Z; a GitHub Release gets the SBOMs
#   - manual run with publish=true: as main, from any ref (to try the publish path)
# Both images are multi-arch indexes (amd64, arm64); a tag's digest is the index's (docs/adr/0014).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish dev versions of this ref
        type: boolean
        default: false

permissions:
  contents: read

# PR runs are superseded by a newer push. Main and tags get a group per commit, so no run is
# cancelled mid-publish or replaced while queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONTROLLER_IMAGE: ghcr.io/lhns/kube-webtop-workspaces
  CONTROLLER_PLATFORMS: linux/amd64,linux/arm64
  DESKTOP_IMAGE: ghcr.io/lhns/kube-webtop-workspaces-desktop

jobs:
  # What this run publishes, if anything. Every other job reads it from here.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.m.outputs.publish }}
      version: ${{ steps.m.outputs.version }}
      chart_version: ${{ steps.m.outputs.chart_version }}
      controller_tags: ${{ steps.m.outputs.controller_tags }}
      desktop_tags: ${{ steps.m.outputs.desktop_tags }}
    steps:
      - id: m
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
              || { echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1; }
            publish=true
            version=$GITHUB_REF_NAME
            chart_version=${version#v}
            tags="$version"
            # A prerelease is not "latest".
            [[ "$version" == *-* ]] || tags="$tags latest"
          else
            if [[ ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ) || "$MANUAL_PUBLISH" == true ]]; then
              publish=true
            fi
            short=${GITHUB_SHA::7}
            version=0.0.0-dev.$short
            chart_version=$version
            tags="$version sha-$short"
            [[ "$GITHUB_REF" != refs/heads/main ]] || tags="$tags main"
          fi
          {
            echo "publish=$publish"
            echo "version=$version"
            echo "chart_version=$chart_version"
            echo "controller_tags=$(for t in $tags; do echo "$CONTROLLER_IMAGE:$t"; done | paste -sd,)"
            echo "desktop_tags=$tags"
          } | tee -a "$GITHUB_OUTPUT"

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # envtest tests skip here (no KUBEBUILDER_ASSETS); the integration job runs them.
      - name: go test (unit)
        run: go test ./... -count=1
      - name: verify generated code is up to date
        run: |
          # Deepcopy, CRD and RBAC, then the chart's CRD copy.
          make generate chart-crd
          git diff --exit-code
          # git diff does not see a newly generated (untracked) file.
          untracked=$(git status --porcelain --untracked-files=all)
          if [ -n "$untracked" ]; then
            echo "generated files not committed:"; echo "$untracked"; exit 1
          fi

  # The in-pod agent is its own Go module (agent/), which `./...` above does not reach.
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: agent/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
      - name: go build (static)
        run: CGO_ENABLED=0 go build ./cmd/webtop-agent
      - name: go.mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

  # The desktop image's NixOS system and webtop-nix must share one nixpkgs (one Qt tree, one store
  # closure, the image builder's skopeo): kww's nixpkgs must follow webtop-nix's, not be its own input.
  nixpkgs-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: nixpkgs follows webtop-nix
        run: |
          jq -e '.nodes.root.inputs.nixpkgs == ["webtop-nix", "nixpkgs"]' flake.lock \
            || { echo "::error::inputs.nixpkgs must be follows = \"webtop-nix/nixpkgs\""; exit 1; }

  # The store overlay across image updates (webtop-nix-lower, webtop-nix-partial,
  # webtop-nix-restore.sh) against real local-overlay stores in privileged nixos/nix containers.
  nix-store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: reinstall (stubbed Nix)
        run: test/nix-store/reinstall-test.sh
      - name: store restore test
        run: test/nix-store/run.sh restore-test.sh
      - name: partial invalidation test
        run: test/nix-store/run.sh partial-test.sh

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: cache envtest assets
        uses: actions/cache@v6
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile', 'go.sum') }}
      # The Makefile fetches kube-apiserver/etcd with `go tool setup-envtest`
      # and runs every test, envtest ones included.
      - name: integration tests (envtest)
        run: make test

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - name: trivy filesystem scan (sources + go.sum)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'docs'

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Without desktop.image the chart refuses to render, and helm lint reports
      # that as INFO and passes without linting anything.
      - name: helm lint
        run: helm lint charts/kube-webtop-workspaces --strict --set desktop.image=example/desktop:1
      - name: helm template + kubeconform
        run: |
          set -euo pipefail
          render() {
            helm template testrelease charts/kube-webtop-workspaces --kube-version 1.31.0 "$@" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0 \
                  -schema-location default -ignore-missing-schemas
          }
          render --set desktop.image=example/desktop:1
          render -f charts/tests/values-all-on.yaml
          render -f charts/tests/values-netpol-off.yaml
      # Also renders the defaults/all-on/netpol-off cases and checks that invalid values are refused.
      - name: chart checks
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 charts/tests/check.py

  # ------ controller image ---------------------------------------------------
  # Built once: the scanned image's layers are the ones pushed (same builder, so the second step is a cache hit).
  controller-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [meta, unit, agent, integration, trivy-fs, helm, nixpkgs-sync, nix-store]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.CONTROLLER_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CONTROLLER_IMAGE }}:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      # ------ publish (main, tags) ------
      - name: log in to ghcr
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push image
        id: push
        if: needs.meta.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ env.CONTROLLER_PLATFORMS }}
          cache-from: type=gha
          tags: ${{ needs.meta.outputs.controller_tags }}
      - name: install cosign
        if: needs.meta.outputs.publish == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: install syft
        if: needs.meta.outputs.publish == 'true'
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0
      # --recursive signs the index and each platform manifest; each SBOM is attested on its platform's manifest.
      - name: sign image, SBOM attestations
        if: needs.meta.outputs.publish == 'true'
        env:
          COSIGN_YES: "true"
          REF: ${{ env.CONTROLLER_IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --recursive "$REF"
          for platform in ${CONTROLLER_PLATFORMS//,/ }; do
            arch=${platform#*/}
            digest=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' \
              | jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest')
            sbom=kube-webtop-workspaces-image-$arch.sbom.spdx.json
            syft "$CONTROLLER_IMAGE@$digest" -o "spdx-json=$sbom"
            cosign attest --predicate "$sbom" --type spdx "$CONTROLLER_IMAGE@$digest"
          done
          echo "controller image: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
      - name: upload SBOMs
        if: needs.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: controller-sbom
          path: kube-webtop-workspaces-image-*.sbom.spdx.json

  # ------ desktop image (NixOS) ----------------------------------------------
  # Built with Nix (flake.nix, nix2container) natively per arch, no emulation: the system evaluates
  # through webtop-nix's KWin graft (import from derivation), so evaluating it means building it.
  # A cold KWin build is 25-45 minutes; the rest is cache.nixos.org and the image layers.
  desktop-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            system: x86_64-linux
            runner: ubuntu-latest
          - arch: arm64
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    name: desktop-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    needs: [meta, unit, agent, integration, trivy-fs, helm, nixpkgs-sync, nix-store]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The Plasma closure is several GB, and the image is loaded into docker as well.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: ./.github/actions/kwin-cache

      # Local binary cache of what this job builds (not on cache.nixos.org). Only main saves, so PR runs
      # restore main's entries and cannot evict them. Unsigned, like kwin-cache: only this repo's
      # workflows write it, and a PR's entry is scoped to its own merge ref.
      # The key cannot come from evaluating (the KWin graft's import from derivation builds). The agent's
      # Go sources are left out on purpose: they rebuild in seconds, the rest in 20 minutes.
      - name: empty built-paths cache directory
        run: |
          sudo rm -rf ~/nix-built-cache
          mkdir ~/nix-built-cache
      - name: restore built paths
        id: nixrestore
        uses: actions/cache/restore@v6
        with:
          path: ~/nix-built-cache
          key: nix-built-${{ matrix.arch }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-keys: nix-built-${{ matrix.arch }}-

      # Not `nix flake check`: it evaluates every system's checks, and the KWin graft (import from
      # derivation) makes evaluating the other system's toplevel a build of it.
      - name: checks
        run: nix build .#checks.${{ matrix.system }}.agent .#checks.${{ matrix.system }}.toplevel-eval -L
      # Paths built here (ultimate), minus KWin (own cache). A binary cache refuses a path whose references
      # it lacks, so they are copied with their closure to a scratch cache and only the built ones kept;
      # the substituted rest comes from cache.nixos.org again.
      - name: save built paths
        if: github.ref == 'refs/heads/main' && steps.nixrestore.outputs.cache-hit != 'true'
        run: |
          nix path-info --all --json --json-format 1 | jq -r 'to_entries[]|select(.value.ultimate)|.key' | grep -v '\.drv$' | sort > built
          nix path-info -r .#kwin | sort > kwin
          comm -23 built kwin > new
          wc -l < new
          sudo chown -R "$USER" ~/nix-built-cache
          full=$RUNNER_TEMP/full
          xargs -a new -r nix copy --to "file://$full?compression=zstd"
          cp "$full/nix-cache-info" ~/nix-built-cache/
          while read -r p; do
            h=$(basename "$p" | cut -c1-32)
            cp "$full/$h.narinfo" ~/nix-built-cache/
            nar=$(sed -n 's/^URL: //p' "$full/$h.narinfo")
            mkdir -p ~/nix-built-cache/"$(dirname "$nar")"
            cp "$full/$nar" ~/nix-built-cache/"$nar"
          done < new
          du -sh ~/nix-built-cache
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.nixrestore.outputs.cache-hit != 'true'
        with:
          path: ~/nix-built-cache
          key: nix-built-${{ matrix.arch }}-${{ hashFiles('flake.lock', '**/*.nix') }}
      # -L prints the layer split table (webtop-nix image/split-layers.py) as well.
      - name: build image
        run: nix build .#image .#image.layerSplit -L -o img
      - name: layer table
        run: |
          {
            echo "### desktop image (${{ matrix.arch }})"
            nix run .#layer-report -- img img-1/groups.json --previous "$DESKTOP_IMAGE:main"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Boots the image under docker and waits for the agent's Ready, which needs KWin compositing.
      # The architecture check guards the index, whose platform entries come from each image's config.
      - name: load image into docker
        run: |
          nix run .#image.copyToDockerDaemon
          arch=$(docker image inspect -f '{{.Architecture}}' "$DESKTOP_IMAGE:dev")
          [ "$arch" = "${{ matrix.arch }}" ] || { echo "::error::image architecture is $arch"; exit 1; }
      - name: boot test
        timeout-minutes: 20
        run: .github/scripts/boot-test.sh ${{ env.DESKTOP_IMAGE }}:dev 900
      - name: boot test (compositing off must be caught)
        timeout-minutes: 15
        run: .github/scripts/boot-test.sh ${{ env.DESKTOP_IMAGE }}:dev 600 gray
      - name: store overlay across an image update
        timeout-minutes: 40
        run: .github/scripts/lower-swap-test.sh ${{ env.DESKTOP_IMAGE }}:dev 300
      - name: boot diagnostics
        if: failure()
        run: |
          docker ps -a
          docker logs desktop-swap 2>&1 | tail -n 100 || true
          docker logs desktop-boot 2>&1 | tail -n 200 || true
          echo "::group::journal (system)"
          docker exec desktop-boot journalctl -b --no-pager 2>&1 | tail -n 500 || true
          echo "::endgroup::"
          echo "::group::journal (user 1000)"
          docker exec desktop-boot journalctl _UID=1000 --no-pager 2>&1 | tail -n 300 || true
          echo "::endgroup::"
          docker exec desktop-boot ps -eo user,pid,args 2>&1 | grep -E 'kwin|plasma|selkies|webtop' || true
      - name: stop test container
        if: always()
        run: docker rm -f desktop-boot desktop-swap || true

      # ------ publish (main, tags) ------
      # By digest only: desktop-index puts the tags on the index. copyTo is skopeo copy from the Nix
      # store; layers already pushed are skipped. zstd at webtop-nix's level with its pinned skopeo:
      # an unchanged layer gives the same blob, so nodes reuse it (webtop-nix ADR 0005).
      - name: push image
        if: needs.meta.outputs.publish == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nix run .#image.copyTo -- --dest-compress-format zstd --dest-compress-level 6 --digestfile digest \
            --dest-creds "${{ github.actor }}:${GHCR_TOKEN}" "docker://${DESKTOP_IMAGE}@@unknown-digest@@"
          mkdir -p out && cp digest "out/${{ matrix.arch }}"
          echo "desktop image (${{ matrix.arch }}): \`${DESKTOP_IMAGE}@$(cat digest)\`" >> "$GITHUB_STEP_SUMMARY"
          REGISTRY_AUTH="${{ github.actor }}:${GHCR_TOKEN}" nix run .#layer-report -- img img-1/groups.json \
            --previous "$DESKTOP_IMAGE:main" --pushed "$DESKTOP_IMAGE@$(cat digest)" | tee -a "$GITHUB_STEP_SUMMARY" || echo "layer report failed (informational)"
      # Matrix legs cannot each set a job output, so the digest travels as an artifact.
      - name: upload digest
        if: needs.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-digest-${{ matrix.arch }}
          path: out/${{ matrix.arch }}

  # Off the critical path: only the digest is needed, and a failure here does not stop publishing.
  desktop-sbom:
    if: needs.meta.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: desktop-sbom (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [meta, desktop-image]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-digest-${{ matrix.arch }}
          path: out
      - name: log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0
      - name: generate image SBOM
        run: syft "${DESKTOP_IMAGE}@$(cat out/${{ matrix.arch }})" -o spdx-json=kube-webtop-workspaces-desktop-${{ matrix.arch }}.sbom.spdx.json
      # No attestation: Rekor rejects the SBOM of the Nix closure. It is published as a file only.
      - name: upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.arch }}-sbom
          path: kube-webtop-workspaces-desktop-${{ matrix.arch }}.sbom.spdx.json

  # The multi-arch index over the per-arch images, every tag in one call: one index, one digest.
  desktop-index:
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [meta, desktop-image]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-digest-*
          merge-multiple: true
          path: digests
      # imagetools and cosign push with the Docker credentials.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create index
        id: index
        env:
          TAGS: ${{ needs.meta.outputs.desktop_tags }}
        run: |
          set -euo pipefail
          args=()
          for tag in $TAGS; do args+=(-t "${DESKTOP_IMAGE}:${tag}"); done
          for f in digests/*; do args+=("${DESKTOP_IMAGE}@$(cat "$f")"); done
          docker buildx imagetools create "${args[@]}"
          digest=$(docker buildx imagetools inspect "${DESKTOP_IMAGE}:${TAGS%% *}" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "${DESKTOP_IMAGE}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          for tag in $TAGS; do echo "pushed ${DESKTOP_IMAGE}:${tag}" >> "$GITHUB_STEP_SUMMARY"; done
          echo "desktop image: \`${DESKTOP_IMAGE}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      # --recursive: the index and each per-arch manifest.
      - name: cosign sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          # Rekor/Fulcio fail transiently; retry the whole call.
          for i in 1 2 3 4 5; do
            cosign sign --recursive "${DESKTOP_IMAGE}@${{ steps.index.outputs.digest }}" && exit 0
            echo "cosign sign failed (attempt $i)"; sleep $((i * 15))
          done
          exit 1

  # ------ Helm chart and GitHub Release --------------------------------------
  chart:
    if: ${{ !cancelled() && needs.meta.outputs.publish == 'true' && needs.controller-image.result == 'success' && needs.desktop-index.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # After both images, so a published chart never points at a missing one.
    # desktop-sbom only has to have finished: its SBOMs go to the release if they exist.
    needs: [meta, controller-image, desktop-index, desktop-sbom]
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      # cosign pushes signatures with the Docker credentials.
      - name: log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0
      - name: package & push chart
        id: helm_push
        env:
          CHART_VERSION: ${{ needs.meta.outputs.chart_version }}
          # The chart defaults image.tag to .Chart.AppVersion, so it deploys the controller image built above.
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          helm package charts/kube-webtop-workspaces \
            --version "$CHART_VERSION" \
            --app-version "$APP_VERSION" \
            --destination .
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push "kube-webtop-workspaces-${CHART_VERSION}.tgz" oci://ghcr.io/lhns/charts \
            2>&1 | tee helm-push.log
          DIGEST=$(grep -E '^Digest: ' helm-push.log | awk '{print $2}')
          echo "chart_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "chart: \`ghcr.io/lhns/charts/kube-webtop-workspaces:${CHART_VERSION}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: sign chart, SBOM attestation
        env:
          COSIGN_YES: "true"
          REF: ghcr.io/lhns/charts/kube-webtop-workspaces@${{ steps.helm_push.outputs.chart_digest }}
        run: |
          cosign sign "$REF"
          syft "kube-webtop-workspaces-${{ needs.meta.outputs.chart_version }}.tgz" \
            -o spdx-json=kube-webtop-workspaces-chart.sbom.spdx.json
          cosign attest --predicate kube-webtop-workspaces-chart.sbom.spdx.json --type spdx "$REF"
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-sbom'
          merge-multiple: true
      - name: checksums for release assets
        run: |
          sha256sum kube-webtop-workspaces-*.tgz kube-webtop-workspaces-*.sbom.spdx.json > checksums.txt
          cat checksums.txt
      - name: attach release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            kube-webtop-workspaces-*.tgz
            kube-webtop-workspaces-*.sbom.spdx.json
            checksums.txt
