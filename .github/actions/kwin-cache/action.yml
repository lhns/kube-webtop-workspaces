name: kwin-cache
description: >
  Installs Nix and makes the patched KWin (webtop-nix) available: restored from the Actions cache by
  its store path, else built (25-45 min on a runner) and cached. Needs a prior checkout.
runs:
  using: composite
  steps:
    # The cache is a local binary cache of the patched KWin closure; the rest of the build comes from
    # cache.nixos.org. Signatures are not checked: only this repo's workflows write it.
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-substituters = file:///home/runner/kwin-cache
          require-sigs = false
    # The key is the store path, which changes with the patch, nixpkgs and flake.lock.
    - name: patched KWin store path
      id: kwin
      shell: bash
      run: |
        out=$(nix eval --raw .#kwin.outPath)
        echo "out=$out" >> "$GITHUB_OUTPUT"
        echo "key=kwin-$(basename "$out" | cut -d- -f1)" >> "$GITHUB_OUTPUT"
    # Evaluating may make the nix daemon (root) create files here; start clean so the restore, which
    # runs as the user, can write.
    - name: empty cache directory
      shell: bash
      run: |
        sudo rm -rf ~/kwin-cache
        mkdir ~/kwin-cache
    - name: restore patched KWin
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ~/kwin-cache
        key: ${{ steps.kwin.outputs.key }}
    - name: build patched KWin
      shell: bash
      run: nix build .#kwin -L --no-link
    # The whole closure: a binary cache refuses a path whose references it lacks. zstd keeps it small.
    - name: save patched KWin
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      # The daemon (root) created parts of the directory while substituting.
      run: |
        sudo chown -R "$USER" ~/kwin-cache
        nix copy --to "file://$HOME/kwin-cache?compression=zstd" "${{ steps.kwin.outputs.out }}"
    - uses: actions/cache/save@v6
      if: steps.restore.outputs.cache-hit != 'true'
      with:
        path: ~/kwin-cache
        key: ${{ steps.kwin.outputs.key }}
