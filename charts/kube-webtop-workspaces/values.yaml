# Values for kube-webtop-workspaces. The sections names, controller, powerApi, desktop,
# storage and gateway (plus metricsAddr/healthAddr) are rendered 1:1 into the shared config file
# (docs/contract.md, "Configuration"); keys the binary does not know make it refuse to start.
# Everything lives in the release namespace.

nameOverride: ""
fullnameOverride: ""

# Image of the controller and the gateway (one binary, --mode selects).
image:
  repository: ghcr.io/lhns/kube-webtop-workspaces
  tag: ""            # default: the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []
logLevel: info
logFormat: json      # json | text

metricsAddr: ":9090"
healthAddr: ":8081"

names:
  prefix: desktop-   # prefix of the per-user Deployment/Service/PVC; starts with a letter, <= 22 chars

controller:
  leaderElection: true
  leaderElectionID: kube-webtop-workspaces
  requireAgentReady: true
  # Container exit codes that count as a clean poweroff from inside the desktop.
  # Must match what PID 1 of the desktop image exits with.
  cleanExitCodes: [0]
  # Desktops reconciled in parallel; one slow desktop holds only one worker.
  maxConcurrentReconciles: 4

powerApi:
  addr: ":8082"
  audience: kube-webtop-workspaces
  # URL the desktop agent uses; empty: http://<release>-controller.<namespace>.svc:<port>.
  url: ""

# Desktop pods created by the controller.
desktop:
  image: ""                   # required, the desktop image
  # Stop (data kept) a desktop whose owner the gateway has not served for this long, e.g. 720h.
  # "0s" never stops one. At least 24h, so a login or gateway outage cannot read as absent users.
  stopAfterUnseen: 0s
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []        # [{name: ...}]
  port: 8080                  # the web client listens here (plain HTTP)
  # Shared ServiceAccount of all desktop pods; empty: <release>-desktop. Created by
  # desktopServiceAccount.create, automount off (a projected token for powerApi.audience is used).
  serviceAccountName: ""
  # RuntimeClass must exist (see docs/cluster-requirements.md); the chart does not create it.
  runtimeClassName: ""
  priorityClassName: ""
  hostUsers: false            # false = user namespace; required for the default security setup
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}
  extraEnv: []                # []corev1.EnvVar
  extraVolumes: []            # []corev1.Volume
  extraVolumeMounts: []       # []corev1.VolumeMount
  # Extra binary caches in the desktops' nix.conf, after cache.nixos.org. Chart-only: passed as
  # WEBTOP_NIX_* env (docs/contract.md). A listed key is trusted by every user's store.
  nix:
    extraSubstituters: []       # ["http://cache.example.org/desktops"]
    extraTrustedPublicKeys: []  # ["desktops:<base64>"]
  # How many apps /apps/<id> may show at once, one Selkies screen each (chart-only: passed as the
  # WEBTOP_MAX_APP_SCREENS env, docs/contract.md). Each visible app screen costs a KWin output plus a
  # capture and an encoder.
  maxAppScreens: 4
  # Session time zone (IANA name) and locale for every desktop (chart-only: passed as WEBTOP_TIME_ZONE /
  # WEBTOP_LOCALE env, docs/contract.md). A user's own webtop.timeZone / webtop.locale wins. Applied when the
  # desktop session starts. Empty: UTC and en_US.UTF-8.
  timeZone: ""                  # "Europe/Berlin"
  locale: ""                    # "de_DE.UTF-8", one built into the image
  # The Nix Software Center's default for listing unfree packages (chart-only: passed as the
  # NSC_UNFREE_LISTED_DEFAULT env, docs/contract.md). A user's own choice in the app overrides it.
  softwareCenter:
    unfreeListedDefault: true
  # Chart-only DaemonSet that keeps the desktop image pulled on every node desktops can run on, so a
  # start after an image update does not wait for the pull. Costs the image's disk (compressed
  # plus unpacked, several GB) per node, twice during a rollover. Uses the desktop pull settings,
  # nodeSelector, tolerations and affinity, none of its privileges.
  prePull:
    enabled: false
    # Runs instead of the desktop image, which is attached as an image volume (needs the
    # ImageVolume feature: GA in Kubernetes 1.36).
    pauseImage: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
    priorityClassName: ""
    resources:
      requests: {cpu: 1m, memory: 8Mi}
      limits: {memory: 16Mi}
  # SELKIES_* settings for every desktop, as strings (docs/contract.md, "Selkies settings"). They
  # override the image's defaults; a user's allowlisted ~/.config/webtop/selkies.env overrides them.
  # Single line, at most 256 characters. Not a security boundary against the desktop user.
  selkies: {}                 # e.g. {SELKIES_FRAMERATE: "30", SELKIES_FILE_TRANSFERS: "none"}
  # Browser tab and sidebar title: a Go text/template, evaluated per desktop. Fields: .User (login),
  # .DisplayName (the login until a display name is available), .Desktop (resource name). They are
  # template data, never template text. Becomes SELKIES_UI_TITLE unless selkies sets it; "" keeps
  # Selkies' own title.
  title: "{{ .User }} – Desktop"
  securityContext: null       # when set, replaces the whole default container securityContext (default caps: SYS_ADMIN, SYS_NICE for NixOS's kwin_wayland wrapper)
  shmSize: 1Gi
  runSizeLimit: 256Mi
  # Must exceed the setup unit's 5 min stop timeout plus the power-hook timeout and the session save.
  terminationGracePeriodSeconds: 420

# Per-user PVC. Created on first start; never deleted by the controller.
storage:
  storageClassName: ""        # empty: cluster default
  size: 50Gi
  accessModes: [ReadWriteOnce]
  mountPath: /persist
  labels: {}
  annotations: {}

gateway:
  addr: ":8080"
  userHeader: Remote-User
  groupsHeader: Remote-Groups
  groupsSeparator: ","
  adminGroup: ""
  requiredGroup: ""
  # SECURITY: the gateway trusts userHeader/groupsHeader from whoever connects; the NetworkPolicy
  # is the gate. Optional extra: peers outside these CIDRs get 403 and incoming X-Forwarded-* are
  # kept only from them. Adds nothing if the proxy shares the pod CIDR with desktop pods. Empty =
  # any peer is trusted and the desktop sees X-Forwarded-Proto: http.
  trustedProxyCIDRs: []
  cookieSecure: true          # false only when serving plain HTTP
  # The user's display name (desktop account name, shown by Plasma); empty header keeps the last one.
  displayNameHeader: Remote-Name
  # Where the browser goes when the desktop session logs out (any absolute http(s) URL, e.g. the
  # login provider's logout endpoint with a return address). Empty: logging out redirects nowhere.
  logoutUrl: ""
  # Which session events sign out at the provider, unless the user chose otherwise in
  # ~/.config/webtop/session.conf. Needs logoutUrl.
  ssoLogoutDefaults: {onLogout: true}

desktopServiceAccount:
  create: true

# Workloads (chart-only; not part of the config file).
controllerPod:
  replicas: 2
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}                # empty: soft anti-affinity across nodes
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    maxUnavailable: ""        # when set, wins over minAvailable

gatewayPod:
  replicas: 2
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}                # empty: soft anti-affinity across nodes
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    maxUnavailable: ""        # when set, wins over minAvailable

gatewayService:
  type: ClusterIP
  port: 80
  annotations: {}

# Optional exposure of the gateway. Both off by default. The proxy in front must authenticate the
# user and set the gateway.userHeader/groupsHeader headers (and strip any client-sent ones).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []                   # [desktop.example.com]
  path: /
  pathType: Prefix
  tls: []                     # [{secretName: ..., hosts: [...]}]

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []              # [{name: gw, namespace: gateway-system}]
  hostnames: []
  path: /

metrics:
  # prometheus.io/scrape pod annotations (port = metricsAddr).
  prometheusAnnotations: false
  serviceMonitor:             # needs the Prometheus Operator CRDs
    enabled: false
    interval: 30s
    scrapeTimeout: ""
    labels: {}

# SECURITY: on by default. Needs a CNI that enforces NetworkPolicy.
#  - gateway: ingress only from the ingress controller (desktop pods cannot reach it: it trusts
#    the Remote-User header)
#  - desktop pods: ingress only from the gateway
#  - controller: power API only from desktop pods
#  - desktop egress: DNS, the power API, and desktopEgress.allowCIDRs minus exceptCIDRs
networkPolicy:
  enabled: true
  # Where the ingress controller / Gateway-API implementation runs. Must not match the desktop
  # pods; at least one of the two selectors is required.
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector: {}
  # Cluster DNS.
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # Who may scrape :metrics on the controller and gateway, e.g.
  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]. Empty: nobody.
  metricsFrom: []
  desktopEgress:
    allowCIDRs: ["0.0.0.0/0"]
    # Carved out of allowCIDRs (an except must lie inside the allow entry of the same IP family).
    # List the cluster's pod, service and node ranges so a desktop cannot reach in-cluster
    # services, the API server or other nodes. The controller and DNS are allowed separately.
    exceptCIDRs: []
    # NetworkPolicyEgressRules appended as-is, e.g. an in-cluster binary cache that exceptCIDRs hides.
    extraRules: []
