---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: desktops.webtop.lhns.github.io
spec:
  group: webtop.lhns.github.io
  names:
    kind: Desktop
    listKind: DesktopList
    plural: desktops
    shortNames:
    - dt
    singular: desktop
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.user
      name: User
      type: string
    - jsonPath: .spec.powerState
      name: Power
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.stage
      name: Stage
      type: string
    - jsonPath: .status.connectedClients
      name: Clients
      type: integer
    - jsonPath: .status.updatePending
      name: Update
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Desktop is one user's persistent desktop.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DesktopSpec is the desired state of a Desktop.
            properties:
              powerState:
                default: "Off"
                description: PowerState is the desired power state.
                enum:
                - "On"
                - "Off"
                type: string
              restartRequestedAt:
                description: |-
                  RestartRequestedAt requests a restart when newer than status.observedRestartAt.
                  A restart also applies a pending update.
                format: date-time
                type: string
              user:
                description: User is the user ID exactly as the auth header and LDAP
                  have it.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: user is immutable
                  rule: self == oldSelf
            required:
            - user
            type: object
          status:
            description: DesktopStatus is the observed state of a Desktop.
            properties:
              agentReady:
                description: AgentReady is true once the agent of PodUID reported
                  ready.
                type: boolean
              appliedTemplateHash:
                description: AppliedTemplateHash is the pod template hash on the Deployment.
                type: string
              bootProgress:
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectedClients:
                format: int32
                type: integer
              idleSeconds:
                format: int64
                type: integer
              lastReportTime:
                format: date-time
                type: string
              lastStart:
                description: LastStart is when powerState last went On or a restart
                  was applied.
                format: date-time
                type: string
              lastStop:
                description: 'LastStop records the most recent recorded stop. Microsecond
                  precision: compared with LastStart.'
                properties:
                  reason:
                    description: StopReason says why a desktop stopped. See docs/contract.md,
                      "Stop reasons".
                    enum:
                    - user
                    - idle
                    - suspend
                    - kube-stop
                    - exit
                    - admin
                    - ldap
                    type: string
                  time:
                    format: date-time
                    type: string
                required:
                - reason
                - time
                type: object
              message:
                description: Message gives detail for Error or an unauthorized desktop.
                type: string
              observedGeneration:
                format: int64
                type: integer
              observedRestartAt:
                description: ObservedRestartAt is the last spec.restartRequestedAt
                  the controller applied.
                format: date-time
                type: string
              phase:
                description: Phase summarises a desktop's state. The gateway proxies
                  only in Running.
                enum:
                - "Off"
                - Starting
                - Running
                - Stopping
                - Error
                type: string
              podName:
                type: string
              podUID:
                type: string
              stage:
                description: Stage is a human-readable current step.
                type: string
              updatePending:
                description: UpdatePending is true while a running desktop's template
                  is out of date.
                type: boolean
              url:
                description: URL is the proxy target of the gateway.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
