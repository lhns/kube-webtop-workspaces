{{- if .Values.desktop.prePull.enabled }}
{{- $d := .Values.desktop }}
{{- $_ := required "desktop.image is required" $d.image }}
{{- /* Not labelled as a desktop pod, so the desktop NetworkPolicy does not select it. */}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kwt.fullname" . }}-desktop-prepull
  labels:
    {{- include "kwt.labels" . | nindent 4 }}
    app.kubernetes.io/component: desktop-prepull
spec:
  selector:
    matchLabels:
      {{- include "kwt.selector" (dict "ctx" . "component" "desktop-prepull") | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        {{- include "kwt.labels" . | nindent 8 }}
        app.kubernetes.io/component: desktop-prepull
    spec:
      automountServiceAccountToken: false
      {{- with $d.prePull.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $d.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prepull
          # Nothing from the desktop image runs; the image volume below keeps it pulled and
          # counts as in use for kubelet image GC.
          image: {{ $d.prePull.pauseImage | quote }}
          volumeMounts:
            - {name: desktop-image, mountPath: /desktop-image, readOnly: true}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          {{- with $d.prePull.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: desktop-image
          image:
            reference: {{ $d.image | quote }}
            pullPolicy: {{ $d.imagePullPolicy }}
{{- end }}
