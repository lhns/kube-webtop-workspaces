{{- /* Rendered 1:1 into internal/config. Chart-only keys are stripped; the config parser rejects unknown fields. */ -}}
{{- $_ := required "desktop.image is required" .Values.desktop.image }}
{{- $desktop := set (omit (deepCopy .Values.desktop) "nix" "prePull" "softwareCenter" "timeZone" "locale") "serviceAccountName" (include "kwt.desktopServiceAccount" .) }}
{{- $nixEnv := list }}
{{- with .Values.desktop.nix.extraSubstituters }}{{ $nixEnv = append $nixEnv (dict "name" "WEBTOP_NIX_EXTRA_SUBSTITUTERS" "value" (join " " .)) }}{{ end }}
{{- with .Values.desktop.nix.extraTrustedPublicKeys }}{{ $nixEnv = append $nixEnv (dict "name" "WEBTOP_NIX_EXTRA_TRUSTED_PUBLIC_KEYS" "value" (join " " .)) }}{{ end }}
{{- with .Values.desktop.timeZone }}{{ $nixEnv = append $nixEnv (dict "name" "WEBTOP_TIME_ZONE" "value" .) }}{{ end }}
{{- with .Values.desktop.locale }}{{ $nixEnv = append $nixEnv (dict "name" "WEBTOP_LOCALE" "value" .) }}{{ end }}
{{- $nixEnv = append $nixEnv (dict "name" "NSC_UNFREE_LISTED_DEFAULT" "value" (ternary "1" "0" (.Values.desktop.softwareCenter.unfreeListedDefault | default false))) }}
{{- with $nixEnv }}{{ $_ := set $desktop "extraEnv" (concat ($desktop.extraEnv | default list) .) }}{{ end }}
{{- $controller := set (deepCopy .Values.controller) "gatewayDeployment" (printf "%s-gateway" (include "kwt.fullname" .)) }}
{{- $powerApi := set (deepCopy .Values.powerApi) "url" (include "kwt.powerApiURL" .) }}
{{- $config := dict
  "namespace" .Release.Namespace
  "names" .Values.names
  "metricsAddr" .Values.metricsAddr
  "healthAddr" .Values.healthAddr
  "controller" $controller
  "powerApi" $powerApi
  "desktop" $desktop
  "storage" .Values.storage
  "gateway" .Values.gateway }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kwt.fullname" . }}
  labels:
    {{- include "kwt.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
