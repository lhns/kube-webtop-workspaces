{{- range $c := list "controller" "gateway" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kwt.fullname" $ }}-{{ $c }}
  labels:
    {{- include "kwt.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c }}
{{- end }}
{{- if .Values.desktopServiceAccount.create }}
---
# Shared by all desktop pods. No RBAC; its projected token (audience powerApi.audience) only
# authenticates the in-pod agent to the controller's power API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kwt.desktopServiceAccount" . }}
  labels:
    {{- include "kwt.labels" . | nindent 4 }}
    app.kubernetes.io/component: desktop
automountServiceAccountToken: false
{{- end }}
