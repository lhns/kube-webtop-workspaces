desktop:
  image: example.org/desktop:1
  runtimeClassName: cgroup-writable
  nodeSelector: {kubernetes.io/os: linux}
  tolerations: [{key: gpu, operator: Exists}]
  extraEnv: [{name: FOO, value: bar}]
  extraVolumes: [{name: data, emptyDir: {}}]
  extraVolumeMounts: [{name: data, mountPath: /data}]
  nix:
    extraSubstituters: [http://cache.example.org/a, http://cache.example.org/b]
    extraTrustedPublicKeys: ["a:AAAA", "b:BBBB"]
  resources: {requests: {cpu: "1", memory: 2Gi}}
  maxAppScreens: 2
  softwareCenter: {unfreeListedDefault: false}
  defaults:
    timeZone: Europe/Berlin
    locale: de_DE.UTF-8
    language: "de:en"
    formats: {LC_TIME: sv_SE.UTF-8}
    xdgConfig:
      kdeglobals: |
        [General]
        ColorScheme=BreezeDark
      kwinrc: |
        [Windows]
        FocusPolicy=ClickToFocus
    homeModule: "{ lib, ... }: { programs.git.enable = lib.mkDefault true; }"
  prePull: {enabled: true}
storage: {storageClassName: fast, size: 10Gi}
controller: {cleanExitCodes: [0, 143]}

gateway:
  adminGroup: admins
  logoutUrl: https://auth.example.org/logout
  displayNameHeader: Remote-Name
  ssoLogoutDefaults: {onLogout: false, onLock: true}
  lockLogsOut: true
  trustedProxyCIDRs: [10.0.0.0/8]
metrics:
  prometheusAnnotations: true
  serviceMonitor: {enabled: true, labels: {release: prom}}
ingress:
  enabled: true
  className: nginx
  hosts: [desktop.example.org]
  tls: [{secretName: tls, hosts: [desktop.example.org]}]
httpRoute:
  enabled: true
  parentRefs: [{name: gw, namespace: gateway-system}]
  hostnames: [desktop.example.org]
networkPolicy:
  metricsFrom: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  desktopEgress:
    allowCIDRs: [0.0.0.0/0, "::/0"]
    exceptCIDRs: [10.0.0.0/8, 192.168.0.0/16, "fd00::/8"]
    extraRules:
      - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cache}}}]
        ports: [{port: 8080, protocol: TCP}]
